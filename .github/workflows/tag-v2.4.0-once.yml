name: One-shot tag v2.4.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tag-v2.4.0-once.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and create v2.4.0 tag
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED_IMPORT=f368c801bffd3e86ea705322143ce37766ebe301
          git cat-file -e "${VERIFIED_IMPORT}^{commit}"
          test "$(git show "${VERIFIED_IMPORT}:VERSION")" = "2.4.0"
          if git rev-parse -q --verify refs/tags/v2.4.0 >/dev/null; then
            test "$(git rev-list -n 1 v2.4.0)" = "$VERIFIED_IMPORT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a v2.4.0 "$VERIFIED_IMPORT" -m 'Evidence-Locked Clinical PPTX Builder v2.4.0 — standalone canonical import'
            git push origin v2.4.0
          fi
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tag-v2.4.0-once.yml
          git commit -m 'Remove one-shot v2.4.0 tagging workflow'
          git push origin HEAD:main
